name: Snow Shot Static Release

on:
  push:
    tags:
      - "v*_snow-shot"

permissions:
  contents: write
  issues: write

concurrency:
  group: snow-shot-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and draft Snow Shot release
    runs-on: windows-2025-vs2026
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select MSVC x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.51
          vsversion: 18.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Export GitHub Actions cache service
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            snow-crates -> ../build/snow-shot-msvc-release/cargo
            snow_draw_engine_qt -> ../build/snow-shot-msvc-release/cargo
          cache-on-failure: true

      - name: Cache static Qt kit
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_64-static
          key: snow-qt-static-6.11.1-msvc2026-x64-${{ runner.os }}

      - name: Prepare Qt 6.11.1 static kit
        shell: pwsh
        env:
          PREINSTALLED_QT_STATIC_DIR: ${{ vars.SNOW_QT_STATIC_DIR }}
        run: |
          $prefix = Join-Path $env:RUNNER_TOOL_CACHE "snow-qt\6.11.1\msvc2026_64-static"
          $qtDir = $env:PREINSTALLED_QT_STATIC_DIR
          if ([string]::IsNullOrWhiteSpace($qtDir)) {
            & "$env:GITHUB_WORKSPACE\scripts\build-static-qt.ps1" -QtVersion 6.11.1 -InstallPrefix $prefix
            if ($LASTEXITCODE -ne 0) { throw "Static Qt bootstrap failed." }
            $qtDir = Join-Path $prefix "lib\cmake\Qt6"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $qtDir "Qt6Config.cmake") -PathType Leaf)) {
            throw "Qt 6.11.1 static CMake package was not found at $qtDir"
          }
          "SNOW_QT_STATIC_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install vcpkg and project dependencies
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -Qt6Dir $env:SNOW_QT_STATIC_DIR -VcpkgVariants Static

      - name: Build, audit, and package statically
        shell: pwsh
        run: |
          & .\scripts\stage-snow-shot-release.ps1 2>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report failure diagnostics
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $logFile = Get-ChildItem -Path . -Recurse -Filter 'build-output.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $logFile) { Write-Host "::error::build-output.log not found"; exit 0 }
          $raw = @(Get-Content -LiteralPath $logFile.FullName)
          $total = $raw.Count
          if ($total -eq 0) { Write-Host "::error::build-output.log is empty"; exit 0 }
          function Clean([string]$s, [int]$max = 220) {
            if ($null -eq $s) { return '' }
            $s = $s -replace "`e\[[0-9;]*[A-Za-z]", ''
            if ($s.Length -gt $max) { $s = $s.Substring(0, $max) }
            return $s
          }
          $patterns = @('error','FAILED:','ninja: build stopped','fatal','Exception','LNK','could not compile','is not recognized')
          $hitIdx = New-Object System.Collections.Generic.List[int]
          $seen = @{}
          for ($i=0; $i -lt $total; $i++) {
            foreach ($p in $patterns) {
              if ($raw[$i] -like "*$p*") {
                for ($j=[Math]::Max(0,$i-2); $j -le [Math]::Min($total-1,$i+2); $j++) {
                  if (-not $seen.ContainsKey($j)) { $seen[$j]=1; $hitIdx.Add($j) }
                }
                break
              }
            }
          }
          $sel = @()
          $sel += @($hitIdx | Select-Object -Last 30)
          $sel += @([Math]::Max(0,$total-40)..($total-1))
          $sel = @($sel | Sort-Object -Unique)
          $n = 0
          foreach ($idx in $sel) {
            $t = (Clean $raw[$idx]) -replace "`r", ''
            if ($n -lt 10) { Write-Host ("::error::L{0}: {1}" -f ($idx+1), $t) }
            elseif ($n -lt 20) { Write-Host ("::warning::L{0}: {1}" -f ($idx+1), $t) }
            else { Write-Host ("L{0}: {1}" -f ($idx+1), $t) }
            $n++
          }
          try {
            $hitsTxt = @($sel | ForEach-Object { "L{0}: {1}" -f ($_+1), (Clean $raw[$_] 300) })
            $tailTxt = @($raw | Select-Object -Last 250 | ForEach-Object { Clean $_ 300 })
            $body = "Auto diagnostics. Run $($env:GITHUB_RUN_ID) attempt $($env:GITHUB_RUN_ATTEMPT). Log lines: $total.`n`n### Pattern hits (last clusters)`n" + ($hitsTxt -join "`n") + "`n`n### Tail 250`n" + ($tailTxt -join "`n")
            if ($body.Length -gt 60000) { $body = $body.Substring(0, 60000) }
            $payload = @{ title = "Snow Shot build failure diagnostics (auto)"; body = $body } | ConvertTo-Json
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Headers $headers -Body $payload -ContentType 'application/json' | Out-Null
            Write-Host "Diagnostics issue created."
          } catch {
            Write-Host ("::warning::issue-post-failed: {0}" -f $_.Exception.Message)
            try {
              $mini = @{ title = "Snow Shot build failure diagnostics (auto)"; body = "Full POST failed: $($_.Exception.Message). See run annotations and build-output-log artifact." } | ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -Body $mini -ContentType 'application/json' | Out-Null
              Write-Host "Mini diagnostics issue created."
            } catch {
              Write-Host ("::warning::mini-issue-failed: {0}" -f $_.Exception.Message)
            }
          }
          exit 0

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: |
            build-output.log
            **/build-output.log
          if-no-files-found: ignore

      - name: Verify tag and locate package
        id: package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v.+_snow-shot$') {
            throw "Unexpected release tag: $env:GITHUB_REF_NAME"
          }
          $packages = @(Get-ChildItem build\snow-shot-msvc-release -File |
            Where-Object { $_.Name -match '^snow-shot-.+\.exe$' -or $_.Name -match '^snow-shot-.+\.exe\.sha256$' })
          if ($packages.Count -lt 2) { throw "The package and SHA-256 checksum were not produced." }
          $assets = ($packages | ForEach-Object { $_.FullName }) -join "`n"
          "assets<<SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $assets | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SNOW_ASSETS" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create draft prerelease with generated changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = "${{ steps.package.outputs.assets }}" -split "`n" | Where-Object { $_ }
          gh release create $env:GITHUB_REF_NAME @assets `
            --draft `
            --prerelease `
            --generate-notes `
            --title "Snow Shot $env:GITHUB_REF_NAME"
